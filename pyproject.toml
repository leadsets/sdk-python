[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "leadsets"
dynamic = ["version"]
description = "Official Python SDK for the Leadsets B2B data API: people and company search, enrichment, email verification and web scraping."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Leadsets" }]
requires-python = ">=3.10"
dependencies = [
  "httpx>=0.27,<1",
  "typing_extensions>=4.7; python_version<'3.12'",
]
keywords = [
  "leadsets",
  "b2b-data",
  "lead-generation",
  "people-search",
  "company-search",
  "enrichment",
  "email-verification",
  "web-scraping",
  "sales",
  "api",
  "sdk",
]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Internet :: WWW/HTTP",
  "Topic :: Software Development :: Libraries :: Python Modules",
  "Typing :: Typed",
]

[project.urls]
Homepage = "https://www.leadsets.ai/?utm_source=github&utm_medium=readme&utm_campaign=sdk-python&utm_content=pyproject"
Documentation = "https://www.leadsets.ai/docs?utm_source=github&utm_medium=readme&utm_campaign=sdk-python&utm_content=pyproject"
Repository = "https://github.com/leadsets/sdk-python"
Issues = "https://github.com/leadsets/sdk-python/issues"
Changelog = "https://github.com/leadsets/sdk-python/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.24",
  "respx>=0.22",
  "ruff>=0.8",
  "mypy>=1.13",
]

[tool.hatch.version]
path = "src/leadsets/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/leadsets"]

[tool.hatch.build.targets.sdist]
include = ["src/leadsets", "tests", "README.md", "LICENSE", "CHANGELOG.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 120
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.format]
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "RUF", "C4", "PT"]
ignore = ["RUF002", "RUF003"]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src", "tests", "examples"]
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
disallow_incomplete_defs = false
